server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large Excel / QSF uploads
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache Vite build assets (fingerprinted)
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public Storage files from Laravel
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri $uri/ =404;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Laravel Framework Health Check
    location = /up {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /up;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
    }

    # Laravel API and Sanctum routes
    location ~ ^/(api|sanctum) {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;

        fastcgi_read_timeout 600;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 600;

        # Disable FastCGI buffering for Server-Sent Events (SSE) live sync
        fastcgi_buffering off;
        fastcgi_cache off;
    }

    # Frontend React SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
